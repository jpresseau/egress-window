document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<title>Egress Window Well — 3D Study<\u002Ftitle>\n\n<script type=\"importmap\">\n{\n  \"imports\": {\n    \"three\": \"https://unpkg.com/three@0.184.0/build/three.module.js\",\n    \"three/addons/controls/OrbitControls.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\",\n    \"three/addons/exporters/OBJExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\",\n    \"three/addons/exporters/GLTFExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\"\n  },\n  \"integrity\": {\n    \"https://unpkg.com/three@0.184.0/build/three.module.js\": \"sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J\",\n    \"https://unpkg.com/three@0.184.0/build/three.core.js\": \"sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\": \"sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\": \"sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\": \"sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ\"\n  }\n}\n<\u002Fscript>\n<style>\n  html, body { margin: 0; height: 100%; overflow: hidden; background: #efece5;\n    -webkit-text-size-adjust: 100%; overscroll-behavior: none; }\n  three-d-stage:not(:defined) { visibility: hidden; }\n  three-d-stage { display: block; width: 100%; height: 100%; }\n  #panel {\n    position: fixed; left: 16px; top: 16px; z-index: 10;\n    width: 262px; max-height: calc(100% - 32px);\n    overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable;\n    -webkit-overflow-scrolling: touch;\n    background: rgba(255,255,255,0.93); backdrop-filter: blur(8px);\n    border: 1px solid rgba(20,20,19,0.14); border-radius: 10px;\n    padding: 16px 16px 14px;\n    font-family: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n    color: #23211d;\n    box-shadow: 0 6px 26px rgba(30,26,20,0.12);\n  }\n  #panelHead { display: flex; align-items: center; gap: 10px; }\n  #panel h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; flex: 1; }\n  #collapse {\n    appearance: none; flex: none; width: 28px; height: 28px; padding: 0; cursor: pointer;\n    border: 1px solid rgba(20,20,19,0.18); border-radius: 6px; background: #fbfaf7;\n    display: grid; place-items: center;\n  }\n  #collapse:hover { background: #fff; }\n  #collapse span {\n    display: block; width: 8px; height: 8px; margin-top: -3px;\n    border-left: 1.6px solid #23211d; border-bottom: 1.6px solid #23211d;\n    transform: rotate(135deg); transition: transform 0.18s ease;\n  }\n  #collapse[aria-expanded=\"false\"] span { transform: rotate(-45deg); margin-top: 3px; }\n  #panelBody { margin-top: 2px; }\n  #panel.is-collapsed { width: auto; max-width: 262px; overflow: hidden; scrollbar-gutter: auto; }\n  #panel.is-collapsed #panelBody { display: none; }\n  #panel .sub { font-size: 11.5px; color: #6d675d; margin: 0 0 14px; line-height: 1.45; }\n  #panel h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em;\n    color: #8a8377; margin: 0 0 7px; font-weight: 600; }\n  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }\n  .row button {\n    appearance: none; font: inherit; font-size: 12px; cursor: pointer;\n    padding: 6px 10px; border-radius: 6px; color: #23211d;\n    border: 1px solid rgba(20,20,19,0.18); background: #fbfaf7;\n  }\n  .row button:hover { background: #fff; }\n  .row button[aria-pressed=\"true\"] { background: #23211d; color: #f7f5f0; border-color: #23211d; }\n  dl { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; margin: 0;\n    font-size: 11.5px; font-family: ui-monospace, \"SF Mono\", Menlo, monospace; }\n  dt { color: #6d675d; }\n  dd { margin: 0; text-align: right; }\n  .note { font-size: 10.5px; color: #8a8377; line-height: 1.5; margin: 13px 0 0; }\n  details > summary { list-style: none; cursor: pointer; margin-bottom: 7px; }\n  details > summary::-webkit-details-marker { display: none; }\n\n  /* phones: the panel becomes a bottom sheet so it never covers the model */\n  @media (max-width: 720px), (max-height: 520px) {\n    #panel {\n      left: 0; right: 0; top: auto; bottom: 0; width: auto;\n      max-height: 52%; border-radius: 14px 14px 0 0;\n      border-width: 1px 0 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));\n    }\n    #panel h1 { font-size: 14px; }\n    #panel.is-collapsed { max-width: none; }\n    #panel .sub { font-size: 11px; margin-bottom: 11px; }\n    .row { gap: 7px; margin-bottom: 11px; }\n    .row button { padding: 9px 13px; font-size: 13px; }\n    dl { font-size: 12px; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"panel\">\n  <div id=\"panelHead\">\n    <h1>Egress window well<\u002Fh1>\n    <button type=\"button\" id=\"collapse\" aria-expanded=\"true\" aria-label=\"Collapse panel\"><span><\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n  <div id=\"panelBody\">\n  <p class=\"sub\">Straight wall on your left as you climb out; terraced steps across the front and right. Cinder block with mahogany caps.<\u002Fp>\n\n  <h2>View<\u002Fh2>\n  <div class=\"row\" id=\"views\">\n    <button type=\"button\" data-view=\"outside\" aria-pressed=\"true\">Outside<\u002Fbutton>\n    <button type=\"button\" data-view=\"inside\">Basement<\u002Fbutton>\n    <button type=\"button\" data-view=\"top\">Overhead<\u002Fbutton>\n    <button type=\"button\" data-view=\"exit\">Steps<\u002Fbutton>\n    <button type=\"button\" data-view=\"house\">House<\u002Fbutton>\n  <\u002Fdiv>\n\n  <h2>Treads &amp; caps<\u002Fh2>\n  <div class=\"row\" id=\"caps\">\n    <button type=\"button\" data-cap=\"mahogany\" aria-pressed=\"true\">Mahogany<\u002Fbutton>\n    <button type=\"button\" data-cap=\"bluestone\">Bluestone<\u002Fbutton>\n    <button type=\"button\" data-cap=\"granite\">Granite<\u002Fbutton>\n    <button type=\"button\" data-cap=\"concrete\">Concrete<\u002Fbutton>\n    <button type=\"button\" data-cap=\"corten\">Corten<\u002Fbutton>\n  <\u002Fdiv>\n\n  <h2>Show<\u002Fh2>\n  <div class=\"row\" id=\"toggles\">\n    <button type=\"button\" data-group=\"plants\" aria-pressed=\"true\">Planters<\u002Fbutton>\n    <button type=\"button\" data-group=\"people\">Figure<\u002Fbutton>\n    <button type=\"button\" data-group=\"interior\">Basement<\u002Fbutton>\n    <button type=\"button\" data-group=\"site\" aria-pressed=\"true\">Yard<\u002Fbutton>\n    <button type=\"button\" id=\"allwood\">Clad walls<\u002Fbutton>\n    <button type=\"button\" id=\"mirror\">Flip<\u002Fbutton>\n  <\u002Fdiv>\n\n  <details id=\"dimsWrap\" open=\"\">\n    <summary><h2 style=\"margin:0 0 7px\">Dimensions<\u002Fh2><\u002Fsummary>\n    <dl id=\"dims\"><\u002Fdl>\n    <p class=\"note\">Grade line and well depth are read off your photos — send measurements and I'll correct them.<\u002Fp>\n  <\u002Fdetails>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<three-d-stage name=\"egress-window-well\" background=\"#efece5\"><\u002Fthree-d-stage>\n\n<script src=\"c2925b32-198d-40e7-abf1-213b66d6dcca\"><\u002Fscript>\n<script type=\"module\">\nimport * as THREE from 'three';\n\nconst IN = 0.0254;\nconst M_ = (i) => i * IN;\n\n// ---- Dimensions (meters). grade = y 0, outside face of foundation = z 0,\n// the well projects toward +z. Looking out from the basement, +x is your LEFT.\nconst D = {\n  winW: M_(31.5),\n  winH: M_(48),\n  sillY: -M_(29),          // sill 29\" below grade (read off the photos)\n  riser: M_(9.5),          // 8\" block course + 1.5\" mahogany cap\n  tread: M_(16),\n  capT: M_(1.5),\n  steps: 4,\n  clearX: -0.55,           // step-side edge of the clear floor\n  wallFaceX: 0.62,         // inner face of the straight wall\n  wallT: 0.22,\n  clearZ: 0.95,\n  foundT: 0.25,\n  houseX0: -2.60,\n  houseX1: 2.00,\n  bFloor: -M_(73),\n};\nD.headY = D.sillY + D.winH;\nD.foundTop = D.headY + M_(3);\nD.floorY = -D.riser * D.steps;\nD.baseY = D.floorY - 0.10;\nD.outX = D.clearX - (D.steps - 1) * D.tread;\nD.outZ = D.clearZ + (D.steps - 1) * D.tread;\nD.ceilY = D.foundTop + 0.07;\n\nconst M = {};\nfunction mat(name, color, o = {}) {\n  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0, ...o });\n  m.name = name; M[name] = m; return m;\n}\nmat('poured_concrete', 0xcfc8b6, { roughness: 0.88 });\nmat('dampproofing', 0x56514a, { roughness: 0.7, metalness: 0.05 });\nmat('shake_siding', 0x33475c, { roughness: 0.92 });\nmat('window_white', 0xefece2, { roughness: 0.5 });\nmat('glass', 0x26343a, { roughness: 0.02, metalness: 0.0, transparent: true, opacity: 0.55, envMapIntensity: 2.2 });\nmat('cinderblock', 0xa8a49a, { roughness: 0.96 });\nmat('mahogany', 0x60331f, { roughness: 0.4, metalness: 0.05 });\nmat('gravel', 0xa39f96, { roughness: 1 });\nmat('lawn', 0x6f7c4d, { roughness: 1 });\nmat('soil', 0x4a3f31, { roughness: 1 });\nmat('foliage', 0x55703e, { roughness: 0.95 });\nmat('figure', 0x8e8e8b, { roughness: 0.8 });\nmat('wall_paint', 0xd8b98a, { roughness: 0.95 });\nmat('trim_white', 0xf4f2eb, { roughness: 0.55 });\nmat('wood_floor', 0xa9763f, { roughness: 0.55 });\nmat('hardware', 0x4c5b3f, { roughness: 0.5, metalness: 0.3 });\nmat('galv_steel', 0x8e9296, { roughness: 0.55, metalness: 0.35 });\nmat('silo_board', 0xb2aea6, { roughness: 0.85 });\nmat('roof_shingle', 0x4b4b48, { roughness: 0.95 });\nmat('hydrangea', 0x6d8a55, { roughness: 0.95 });\nmat('bark', 0x5b4a3a, { roughness: 1 });\nmat('canopy', 0x4f6b3c, { roughness: 1 });\nmat('river_rock', 0x8d8478, { roughness: 0.85 });\nmat('planter_stone', 0xbdb6a8, { roughness: 0.92 });\nmat('bluestone', 0x4e5865, { roughness: 0.82 });\nmat('granite', 0x74726e, { roughness: 0.62 });\nmat('cast_cap', 0xa39d91, { roughness: 0.9 });\nmat('corten', 0x8a4a2c, { roughness: 0.55, metalness: 0.3 });\nconst materials = M;\n\n// ---- Procedural surfaces (CanvasTexture; kept in the GLB, dropped by OBJ)\nfunction canvasTex(w, h, draw) {\n  const c = document.createElement('canvas');\n  c.width = w; c.height = h;\n  draw(c.getContext('2d'), w, h);\n  const t = new THREE.CanvasTexture(c);\n  t.wrapS = t.wrapT = THREE.RepeatWrapping;\n  t.anisotropy = 8;\n  t.colorSpace = THREE.SRGBColorSpace;\n  return t;\n}\nconst rnd = (() => { let s = 20260919; return () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648; })();\nfunction speckle(ctx, w, h, base, spots, rMin, rMax, shades) {\n  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);\n  for (let i = 0; i < spots; i++) {\n    ctx.fillStyle = shades[(rnd() * shades.length) | 0];\n    ctx.globalAlpha = 0.25 + rnd() * 0.55;\n    const r = rMin + rnd() * (rMax - rMin);\n    ctx.beginPath(); ctx.arc(rnd() * w, rnd() * h, r, 0, 6.2832); ctx.fill();\n  }\n  ctx.globalAlpha = 1;\n}\nfunction applyTex(name, tex, tiles, bump) {\n  const m = M[name];\n  m.color.set(0xffffff);\n  m.map = tex;\n  m.userData.tiles = tiles;\n  if (bump) { m.bumpMap = tex; m.bumpScale = bump; }\n  m.needsUpdate = true;\n}\n\napplyTex('poured_concrete', canvasTex(256, 256, (c, w, h) => {\n  speckle(c, w, h, '#cfc8b6', 900, 1, 9, ['#c4bcaa', '#d8d2c2', '#b9b2a2', '#dcd7c9']);\n}), [1.1, 1.1], 0.004);\n\napplyTex('cinderblock', canvasTex(256, 128, (c, w, h) => {\n  speckle(c, w, h, '#928e85', 700, 1, 6, ['#89857c', '#9b978e', '#817d75']);\n  c.fillStyle = 'rgba(118,114,106,0.75)';\n  const j = 4;\n  c.fillRect(0, 0, w, j); c.fillRect(0, h - j, w, j);\n  c.fillRect(0, 0, j, h); c.fillRect(w - j, 0, j, h);\n}), [2.46, 4.92], 0.012);\n\napplyTex('mahogany', canvasTex(512, 128, (c, w, h) => {\n  c.fillStyle = '#70402a'; c.fillRect(0, 0, w, h);\n  for (let i = 0; i < 260; i++) {\n    const y = rnd() * h, len = 40 + rnd() * 420, x = rnd() * w;\n    c.strokeStyle = rnd() > 0.5 ? 'rgba(140,80,48,0.5)' : 'rgba(70,38,22,0.5)';\n    c.lineWidth = 0.6 + rnd() * 2.2;\n    c.beginPath(); c.moveTo(x, y); c.bezierCurveTo(x + len / 3, y + (rnd() - 0.5) * 6, x + len / 1.6, y + (rnd() - 0.5) * 6, x + len, y); c.stroke();\n  }\n}), [0.9, 3.4], 0.005);\n\napplyTex('gravel', canvasTex(256, 256, (c, w, h) => {\n  speckle(c, w, h, '#9c988f', 2600, 1.5, 5.5, ['#b8b3a8', '#84807a', '#c6c1b4', '#6f6c66', '#a9a49a']);\n}), [7, 7], 0.02);\n\napplyTex('lawn', canvasTex(256, 256, (c, w, h) => {\n  speckle(c, w, h, '#7f8d5a', 3200, 1, 4, ['#74814f', '#8c9a66', '#6a7748', '#97a470']);\n}), [5, 5], 0.006);\n\napplyTex('soil', canvasTex(256, 256, (c, w, h) => {\n  speckle(c, w, h, '#4a3f31', 1600, 1.5, 7, ['#3c3228', '#57493a', '#645440', '#332b22']);\n}), [2.2, 2.2], 0.01);\n\napplyTex('shake_siding', canvasTex(512, 128, (c, w, h) => {\n  c.fillStyle = '#33475c'; c.fillRect(0, 0, w, h);\n  for (let k = 0; k < 4; k++) {                      // four 7\" shingles per tile\n    const x0 = k * (w / 4);\n    c.fillStyle = `rgba(${52 + ((rnd() * 18) | 0)},${70 + ((rnd() * 18) | 0)},${92 + ((rnd() * 20) | 0)},0.35)`;\n    c.fillRect(x0 + 3, 0, w / 4 - 6, h);\n    c.fillStyle = 'rgba(18,26,36,0.85)';             // keyway\n    c.fillRect(x0, 0, 3, h);\n  }\n  c.fillStyle = 'rgba(14,20,28,0.9)';                // butt shadow line\n  c.fillRect(0, h - 7, w, 7);\n  c.fillStyle = 'rgba(120,140,164,0.16)';\n  c.fillRect(0, h - 10, w, 3);\n}), [1.406, 5.62], 0.02);\n\napplyTex('river_rock', canvasTex(256, 256, (c, w, h) => {\n  speckle(c, w, h, '#8d8478', 2200, 2, 7, ['#a49a89', '#77705f', '#b3a892', '#655f52', '#8f8676']);\n}), [4, 4], 0.02);\n\napplyTex('silo_board', canvasTex(128, 128, (c, w, h) => {\n  speckle(c, w, h, '#b2aea6', 300, 2, 9, ['#a9a59d', '#bbb7af']);\n  for (let x = 0; x < w; x += w / 6) {\n    c.fillStyle = 'rgba(126,122,114,0.7)'; c.fillRect(x, 0, 2, h);\n    c.fillStyle = 'rgba(214,210,202,0.35)'; c.fillRect(x + 2, 0, 2, h);\n  }\n}), [4.4, 1.6], 0.012);\nM.silo_board.userData.tiles = null;          // cylinder UVs: set repeat directly\nM.silo_board.map.repeat.set(12, 1);\n\napplyTex('bluestone', canvasTex(256, 256, (c, w, h) => {\n  speckle(c, w, h, '#4e5865', 1400, 2, 12, ['#454e5a', '#5a6470', '#3d4551', '#646e7a']);\n  for (let i = 0; i < 40; i++) {                 // cleft ripples\n    c.strokeStyle = 'rgba(70,80,92,0.5)'; c.lineWidth = 0.8 + rnd() * 2;\n    const y = rnd() * h; c.beginPath(); c.moveTo(0, y);\n    c.bezierCurveTo(w / 3, y + (rnd() - 0.5) * 14, w / 1.5, y + (rnd() - 0.5) * 14, w, y); c.stroke();\n  }\n}), [1.0, 1.0], 0.012);\n\napplyTex('granite', canvasTex(256, 256, (c, w, h) => {\n  speckle(c, w, h, '#74726e', 3200, 1, 4, ['#4a4846', '#a09d97', '#605d59', '#8a8781', '#333230']);\n}), [1.6, 1.6], 0.008);\n\napplyTex('cast_cap', canvasTex(256, 256, (c, w, h) => {\n  speckle(c, w, h, '#a39d91', 700, 2, 10, ['#9a9488', '#aca698']);\n}), [1.0, 1.0], 0.004);\n\napplyTex('corten', canvasTex(256, 256, (c, w, h) => {\n  speckle(c, w, h, '#8a4a2c', 1800, 2, 14, ['#79401f', '#9c5836', '#6a3a22', '#a9663f']);\n}), [1.2, 1.2], 0.006);\n\napplyTex('planter_stone', canvasTex(256, 256, (c, w, h) => {\n  speckle(c, w, h, '#bdb6a8', 900, 1, 8, ['#b3ac9e', '#c7c0b2', '#a9a295']);\n}), [2.2, 2.2], 0.006);\n\napplyTex('wall_paint', canvasTex(128, 128, (c, w, h) => {\n  speckle(c, w, h, '#d8b98a', 500, 2, 10, ['#d2b284', '#dec092']);\n}), [1.2, 1.2], 0);\n\napplyTex('wood_floor', canvasTex(512, 128, (c, w, h) => {\n  c.fillStyle = '#a9763f'; c.fillRect(0, 0, w, h);\n  for (let i = 0; i < 200; i++) {\n    c.strokeStyle = rnd() > 0.5 ? 'rgba(186,137,80,0.5)' : 'rgba(126,86,44,0.5)';\n    c.lineWidth = 0.6 + rnd() * 2;\n    const y = rnd() * h, x = rnd() * w, len = 60 + rnd() * 300;\n    c.beginPath(); c.moveTo(x, y); c.lineTo(x + len, y + (rnd() - 0.5) * 3); c.stroke();\n  }\n  c.fillStyle = 'rgba(70,45,22,0.55)';\n  for (let y = 0; y < h; y += h / 2) c.fillRect(0, y, w, 1.5);\n}), [0.7, 2.2], 0.004);\n\n// Irregular foliage blob — a jittered icosahedron reads far better than a sphere.\nfunction shrubGeo(r) {\n  const g = new THREE.IcosahedronGeometry(r, 2);\n  const p = g.attributes.position;\n  for (let i = 0; i < p.count; i++) {\n    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);\n    const k = 1 + 0.22 * Math.sin(x * 9.1 + y * 5.3) * Math.cos(z * 7.7 - y * 3.1) + (rnd() - 0.5) * 0.12;\n    p.setXYZ(i, x * k, y * k * 0.82, z * k);\n  }\n  g.computeVertexNormals();\n  return g;\n}\n\nfunction scaleBoxUVs(g, dx, dy, dz, tiles) {\n  const uv = g.attributes.uv;\n  const spans = [[dz, dy], [dz, dy], [dx, dz], [dx, dz], [dx, dy], [dx, dy]];\n  for (let fi = 0; fi < 6; fi++) {\n    const [su, sv] = spans[fi];\n    for (let i = 0; i < 4; i++) {\n      const k = fi * 4 + i;\n      uv.setXY(k, uv.getX(k) * su * tiles[0], uv.getY(k) * sv * tiles[1]);\n    }\n  }\n  uv.needsUpdate = true;\n}\n\n\n\n// Cap / tread options: material + how wide each piece runs\nconst CAPS = {\n  mahogany:  { mat: 'mahogany',  piece: 5.5 },\n  bluestone: { mat: 'bluestone', piece: 24 },\n  granite:   { mat: 'granite',   piece: 30 },\n  concrete:  { mat: 'cast_cap',  piece: 0 },   // 0 = continuous pour\n  corten:    { mat: 'corten',    piece: 12 },\n};\nlet n = 0;\nlet CAP = CAPS.mahogany;\nlet WOOD = false;\nconst uid = (s) => `${s}_${(++n).toString().padStart(3, '0')}`;\n\nfunction box(parent, name, material, x0, x1, y0, y1, z0, z1) {\n  const dx = Math.abs(x1 - x0) || 0.001, dy = Math.abs(y1 - y0) || 0.001, dz = Math.abs(z1 - z0) || 0.001;\n  const g = new THREE.BoxGeometry(dx, dy, dz);\n  const tiles = M[material].userData.tiles;\n  if (tiles) scaleBoxUVs(g, dx, dy, dz, tiles);\n  const m = new THREE.Mesh(g, M[material]);\n  m.name = uid(name);\n  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);\n  parent.add(m);\n  return m;\n}\n\n// Block course capped with mahogany decking. `dir` is the plank run direction + 0.025 * Math.abs(Math.sin(seed + i * 2.3));\n    const s = new THREE.Mesh(shrubGeo(r), M.foliage);\n    s.name = uid('shrub'); s.rotation.y = rnd() * 6.28;\n    s.position.set(cx + 0.075 * Math.cos(seed + i * 2.6), y1 - 0.02 + r * 0.75, cz + 0.07 * Math.sin(seed + i * 2.6));\n    g.add(s);\n  }\n  parent.add(g);\n}\n\nfunction figure(parent, x, z, base) {\n  const g = new THREE.Group(); g.name = 'scale_figure';\n  const f = base;\n  const legG = new THREE.CapsuleGeometry(0.075, 0.60, 4, 12);\n  for (const [nm, dx] of [['figure_leg_L', -0.09], ['figure_leg_R', 0.09]]) {\n    const l = new THREE.Mesh(legG, M.figure); l.name = nm; l.position.set(x + dx, f + 0.38, z); g.add(l);\n  }\n  const t = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.42, 4, 16), M.figure);\n  t.name = 'figure_torso'; t.position.set(x, f + 1.00, z); t.scale.z = 0.62; g.add(t);\n  const h = new THREE.Mesh(new THREE.SphereGeometry(0.105, 24, 16), M.figure);\n  h.name = 'figure_head'; h.position.set(x, f + 1.44, z); g.add(h);\n  parent.add(g);\n}\n\nfunction buildModel(opts = {}) {\n  n = 0;\n  CAP = CAPS[opts.cap] || CAPS.mahogany;\n  D.capT = opts.cap && opts.cap !== 'mahogany' ? M_(2) : M_(1.5);\n  WOOD = !!opts.allWood;\n  const model = new THREE.Group(); model.name = 'egress_window_well';\n  const house = new THREE.Group(); house.name = 'house'; model.add(house);\n  const well = new THREE.Group(); well.name = 'window_well'; model.add(well);\n  const site = new THREE.Group(); site.name = 'site'; model.add(site);\n  const plants = new THREE.Group(); plants.name = 'planters'; model.add(plants);\n  const interior = new THREE.Group(); interior.name = 'basement'; model.add(interior);\n  const people = new THREE.Group(); people.name = 'scale'; model.add(people);\n  const shade = new THREE.Group(); shade.name = 'window_backdrop'; model.add(shade);\n\n  const s = opts.mirror ? -1 : 1;\n  const WF = D.wallFaceX * s, WO = (D.wallFaceX + D.wallT) * s;\n  const CX = D.clearX * s, OX = D.outX * s, TR = D.tread * s;\n  const hs = -1;                                // house/yard are fixed — only the well mirrors\n  const cornX = -1.95 * hs;                     // house corner nearest the window\n  const siloEndX = 7.60 * hs;\n  const hx0 = Math.min(cornX, siloEndX), hx1 = Math.max(cornX, siloEndX);\n  const GW = WO + 16 * s, GO = OX - 16 * s;     // yard edges, past wall / past steps\n  const foundBot = -2.02;\n  const { foundTop: ftp, sillY, headY, winW, foundT } = D;\n  const jL = winW / 2, jR = -winW / 2;\n\n  // ---------- Foundation (poured concrete, opening cut for the window)\n  box(house, 'foundation_below_sill', 'poured_concrete', hx0, hx1, foundBot, sillY, -foundT, 0);\n  box(house, 'foundation_header', 'poured_concrete', hx0, hx1, headY, ftp, -foundT, 0);\n  box(house, 'foundation_jamb', 'poured_concrete', jL, hx1, sillY, headY, -foundT, 0);\n  box(house, 'foundation_jamb', 'poured_concrete', hx0, jR, sillY, headY, -foundT, 0);\n  // damp-proofing on everything that ends up below grade\n  box(house, 'dampproofing', 'dampproofing', hx0, jR, foundBot, -0.02, 0, 0.004);\n  box(house, 'dampproofing', 'dampproofing', jL, hx1, foundBot, -0.02, 0, 0.004);\n  box(house, 'dampproofing', 'dampproofing', jR, jL, foundBot, sillY - 0.03, 0, 0.004);\n\n  // ---------- HardieShingle wall above the foundation\n  const eaveY = 8.20, ridgeX = (hx0 + hx1) / 2, ridgeY = 10.90;\n  box(house, 'shingle_wall', 'shake_siding', hx0, hx1, ftp, eaveY, -0.03, 0.012);\n  box(house, 'foundation_top_ledge', 'poured_concrete', hx0, hx1, ftp - 0.012, ftp + 0.006, -foundT, 0.008);\n\n  // gable triangle, roof planes and rake trim\n  const half = (hx1 - hx0) / 2, rise = ridgeY - eaveY;\n  const slopeLen = Math.hypot(half, rise), slopeAng = Math.atan2(rise, half);\n  {\n    const shp = new THREE.Shape();\n    shp.moveTo(hx0, eaveY); shp.lineTo(hx1, eaveY); shp.lineTo(ridgeX, ridgeY); shp.closePath();\n    const g = new THREE.ExtrudeGeometry(shp, { depth: 0.042, bevelEnabled: false });\n    const gm = M.shake_siding.clone(); gm.name = 'shake_siding_gable';\n    gm.map = M.shake_siding.map.clone(); gm.map.needsUpdate = true;\n    gm.map.repeat.set(1.406, 5.62); gm.bumpMap = gm.map;\n    const gable = new THREE.Mesh(g, gm);\n    gable.name = uid('gable_wall'); gable.position.z = -0.03; house.add(gable);\n  }\n  for (const dir of [-1, 1]) {\n    const roof = box(house, 'roof_plane', 'roof_shingle',\n      -slopeLen / 2, slopeLen / 2, -0.09, 0.09, -6.9, 0.32);\n    roof.rotation.z = dir * slopeAng;\n    roof.position.set(ridgeX + dir * (-half / 2), eaveY + rise / 2, (-6.9 + 0.32) / 2);\n    const rake = box(house, 'rake_trim', 'window_white',\n      -slopeLen / 2, slopeLen / 2, 0.09, 0.30, 0.055, 0.30);\n    rake.rotation.z = dir * slopeAng;\n    rake.position.set(ridgeX + dir * (-half / 2), eaveY + rise / 2, 0.18);\n  }\n\n  // return wall at the corner nearest the well\n  box(house, 'return_wall', 'shake_siding', cornX - 0.26 * hs, cornX, ftp, eaveY, -7.0, -0.02);\n  box(house, 'return_foundation', 'poured_concrete', cornX - 0.26 * hs, cornX, foundBot, ftp, -7.0, -0.02);\n  box(house, 'corner_board', 'window_white', cornX - 0.30 * hs, cornX - 0.24 * hs, ftp, eaveY, -0.03, 0.045);\n\n  // shingled chimney chase with its stepped white cap\n  const cx0 = cornX - 0.20 * hs, cx1 = cornX - 1.15 * hs;\n  box(house, 'chimney_chase', 'shake_siding', cx0, cx1, ftp, 11.55, -1.75, -0.35);\n  for (const [i, w2] of [[0, 0.10], [1, 0.05], [2, 0.0]].entries ? [[0, 0.10], [1, 0.05], [2, 0.0]] : []) {\n    box(house, 'chimney_cap', 'window_white', cx0 + w2, cx1 - w2, 11.55 + i * 0.13, 11.68 + i * 0.13, -1.75 + w2, -0.35 - w2);\n  }\n  const flue = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.42, 16), M.galv_steel);\n  flue.name = uid('flue'); flue.position.set((cx0 + cx1) / 2, 12.15, -1.05); house.add(flue);\n\n  // upper-floor windows (two per level: tall narrow + wide unit)\n  const winRows = [[1.05, 1.95], [3.85, 1.62], [6.55, 1.30]];\n  for (const [sy, hh] of , headY - fT, headY, -0.05, 0.025);\n  box(house, 'window_frame_sill', 'window_white', jR - 0.05, jL + 0.05, sillY, sillY + M_(2), -0.05, 0.06);\n  box(house, 'window_frame_jamb', 'window_white', jL - fT, jL + 0.03, sillY, headY, -0.05, 0.025);\n  box(house, 'window_frame_jamb', 'window_white', jR - 0.03, jR + fT, sillY, headY, -0.05, 0.025);\n\n  const sash = new THREE.Group(); sash.name = 'casement_sash';\n  const sw = winW - fT * 2 - 0.012, sh = headY - sillY - fT * 2 - M_(2), st = M_(1.9), r = M_(2.2);\n  box(sash, 'sash_rail', 'window_white', -sw, 0, 0, r, 0, st);\n  box(sash, 'sash_rail', 'window_white', -sw, 0, sh - r, sh, 0, st);\n  box(sash, 'sash_stile', 'window_white', -r, 0, 0, sh, 0, st);\n  box(sash, 'sash_stile', 'window_white', -sw, -sw + r, 0, sh, 0, st);\n  box(sash, 'sash_glass', 'glass', -sw + r, -r, r, sh - r, 0.006, 0.014);\n  // hinged on the straight-wall jamb\n  sash.position.set(jL - fT, sillY + fT + M_(2), 0.014);\n  sash.rotation.y = THREE.MathUtils.degToRad(82);\n  house.add(sash);\n\n  // ---------- The well: straight wall on one side, terraces on the other two\n  cappedWall(well, 'straight_wall', WF, WO, -0.04, D.outZ, 0, 'x');\n  for (let i = 1; i <= D.steps - 1; i++) {\n    const xi = CX - (i - 1) * TR, zi = D.clearZ + (i - 1) * D.tread;\n    const xo = xi - TR, zo = zi + D.tread;\n    const top = D.floorY + i * D.riser;\n    cappedWall(well, `tier${i}_side`, xo, xi, -0.04, zi, top, 'x');\n    cappedWall(well, `tier${i}_front`, xo, WO, zi, zo, top, 'z');\n  }\n  box(well, 'gravel_bed', 'gravel', CX, WF, D.floorY - 0.10, D.floorY, 0, D.clearZ);\n  box(well, 'well_footing', 'poured_concrete', OX - 0.06 * s, WO + 0.06 * s, D.baseY - 0.10, D.baseY, -0.06, D.outZ + 0.06);\n\n  // ---------- Grade, beds and planting\n  const gT = 0.20, gz1 = D.outZ + 26;\n  const eb = foundBot - 0.04;   // carry the soil past the footing so no void shows\n  for (const [a, b, c2, d2] of [[WO, GW, 0, gz1], [GO, OX, 0, gz1], [OX, WO, D.outZ, gz1]]) {\n    box tation.y = rnd() * 6.28;\n      cn.position.set(tx + (rnd() - 0.5) * th * 0.24, th * (0.62 + i * 0.13), tz + (rnd() - 0.5) * th * 0.24);\n      g2.add(cn);\n    }\n    site.add(g2);\n  }\n\n  // ---------- Planters on the terraces\n  const tTop = (i) => D.floorY + i * D.riser;\n  planter(plants, 0.36 * s, D.clearZ + D.tread * 0.5, tTop(1), 0.40, 0.34, 0.26);\n  planter(plants, CX - TR * 1.5, D.clearZ + D.tread * 1.5, tTop(2), 0.36, 0.32, 0.22);\n  planter(plants, 0.30 * s, D.clearZ + D.tread * 1.5, tTop(2), 0.44, 0.32, 0.22);\n  planter(plants, -0.95 * s, D.clearZ + D.tread * 2.5, tTop(3), 0.42, 0.32, 0.22);\n  planter(plants, 0.40 * s, D.clearZ + D.tread * 2.5, tTop(3), 0.42, 0.32, 0.22);\n\n  // ---------- Basement room (finished, as photographed)\n  const bf = D.bFloor, iw = foundT;\n  const rx0 = -2.30, rx1 = 2.30, back = -4.20;\n  const wz0 = -iw - 0.11, wz1 = -iw - 0.095;      // face / back of the furred-out wall\n  const ceil = D.ceilY;\n\n  box(interior, 'basement_slab', 'poured_concrete', rx0 - 0.12, rx1 + 0.12, bf - 0.12, bf, back - 0.12, -iw);\n  box(interior, 'floor_planks', 'wood_floor', rx0, rx1, bf, bf + 0.016, back, wz0);\n  // full floor-assembly slab, carried through to the wall so nothing outside shows over it\n  box(interior, 'ceiling', 'trim_white', rx0, rx1, ceil, ceil + 0.42, back, -0.02);\n\n  // window wall, built around the opening\n  box(interior, 'wall_paint', 'wall_paint', rx0, jR - M_(3.5), bf, ceil, wz0, wz1);\n  box(interior, 'wall_paint', 'wall_paint', jL + M_(3.5), rx1, bf, ceil, wz0, wz1);\n  box(interior, 'wall_paint', 'wall_paint', jR - M_(3.5), jL + M_(3.5), bf, sillY - M_(3.5), wz0, wz1);\n  box(interior, 'wall_paint', 'wall_paint', jR - M_(3.5), jL + M_(3.5), headY + M_(3.5), ceil, wz0, wz1);\n  // side and back walls so the room reads as a room\n  box(interior, 'wall_paint', 'wall_paint', rx0, rx0 + 0.015, bf, ceil, back, wz1);\n  box(interior, 'wall_paint', 'wall_paint', rx1 - 0.015, rx1, bf, ceil, back, wz1);\n  box(interior, 'wall_paint', 'wall_paint', rx0, rx1, bf, ceil, back, back + 0.015);\n\n  for (const [a, b, c2, d2] of [[rx0, rx1, wz0 - 0.014, wz1], [rx0, rx0 + 0.029, back, wz1], [rx1 - 0.029, rx1, back, wz1], [rx0, rx1, back, back + 0.029]])\n    box(interior, 'baseboard', 'trim_white', a, b, bf, bf + M_(5.5), c2, d2);\n\n  // jamb returns, casing, stool and apron\n  box(interior, 'jamb_return', 'trim_white', jR, jR + 0.016, sillY, headY, wz0, 0);\n  box(interior, 'jamb_return', 'trim_white', jL - 0.016, jL, sillY, headY, wz0, 0);\n  box(interior, 'head_return', 'trim_white', jR, jL, headY - 0.016, headY, wz0, 0);\n  box(interior, 'window_stool', 'trim_white', jR - M_(2.5), jL + M_(2.5), sillY - 0.024, sillY + M_(1), wz0 - 0.038, 0);\n  box(interior, 'casing', 'trim_white', jR - M_(3.5), jR, sillY, headY + M_(3.5), wz0 - 0.024, wz0);\n  box(interior, 'casing', 'trim_white', jL, jL + M_(3.5), sillY, headY + M_(3.5), wz0 - 0.024, wz0);\n  box(interior, 'casing_head', 'trim_white', jR - M_(4.6), jL + M_(4.6), headY + M_(3.5), headY + M_(4.8), wz0 - 0.032, wz0);\n  box(interior, 'casing_head_cap', 'trim_white', jR - M_(5.2), jL + M_(5.2), headY + M_(4.8), headY + M_(5.4), wz0 - 0.044, wz0);\n  box(interior, 'apron', 'trim_white', jR - M_(2), jL + M_(2), sillY - M_(3.6), sillY - 0.024, wz0 - 0.020, wz0);\n\n  const lamp = new THREE.PointLight(0xffdfb2, 3.2, 8, 2);\n  lamp.name = 'room_light'; lamp.position.set(0, ceil - 0.25, -2.4); interior.add(lamp);\n  const bounce = new THREE.PointLight(0xffe8cc, 1.1, 5, 2);\n  bounce.name = 'room_bounce'; bounce.position.set(0, sillY + 0.3, -1.0); interior.add(bounce);\n\n  figure(people, (D.wallFaceX - 0.22) * s, 0.26, D.floorY);\n\n  model.userData.groups = { house, well, site, plants, interior, people, shade };\n  return model;\n}\n\n\nconst stage = document.querySelector('three-d-stage');\nawait stage.ready;\n\n// ---- Outdoor lighting: filmic tone mapping + a sky/ground IBL so the\n// concrete and glass pick up real bounce instead of flat studio grey.\nconst small = window.matchMedia('(max-width: 720px), (max-height: 520px)').matches;\n{\n  const R = stage._renderer, SC = stage._scene;\n  R.setPixelRatio(Math.min(window.devicePixelRatio || 1, small ? 1.5 : 2));\n  R.toneMapping = THREE.ACESFilmicToneMapping;\n  R.toneMappingExposure = 1.25;\n  R.shadowMap.type = THREE.PCFSoftShadowMap;\n\n  const c = document.createElement('canvas');\n  c.width = 256; c.height = 256;\n  const g = c.getContext('2d').createLinearGradient(0, 0, 0, 256);\n  g.addColorStop(0.00, '#3f72bb');\n  g.addColorStop(0.38, '#8fb6e0');\n  g.addColorStop(0.49, '#dfe6e6');\n  g.addColorStop(0.54, '#6f7e58');\n  g.addColorStop(1.00, '#43452f');\n  const ctx = c.getContext('2d');\n  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);\n  const skyTex = new THREE.CanvasTexture(c);\n  skyTex.mapping = THREE.EquirectangularReflectionMapping;\n  skyTex.colorSpace = THREE.SRGBColorSpace;\n  const pmrem = new THREE.PMREMGenerator(R);\n  const envTex = pmrem.fromEquirectangular(skyTex).texture;\n  SC.environment = envTex;\n  SC.environmentIntensity = 1.0;\n  SC.background = envTex;          // PMREM output — the only kind blurriness works on\n  SC.backgroundBlurriness = 0.18;\n  SC.backgroundIntensity = 1.0;\n  pmrem.dispose();\n\n  for (const l of SC.children.filter((o) => o.isLight)) {\n    if (l.isHemisphereLight) { l.intensity = 0.95; l.groundColor.set(0x9a9583); }\n    else if (l.castShadow) { l.intensity = 3.1; l.color.set(0xfff2dc); l.position.set(7, 9, 6); }\n    else { l.intensity = 0.7; l.color.set(0xd6e2f0); }\n  }\n}\n\nlet mirrored = false;\nlet model = buildModel({ mirror: mirrored });\nstage.setObject(model);\nlet G = model.userData.groups;\n// keep the sun's shadow frustum on the well, not the whole 60 m yard\nfunction tuneShadows() {\n  const k = stage._key, sc = k.shadow.camera;\n  sc.left = -11; sc.right = 11; sc.top = 11; sc.bottom = -11;\n  sc.near = 0.5; sc.far = 70; sc.updateProjectionMatrix();\n  k.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);\n  k.shadow.bias = -0.0004;\n  k.target.position.set(0, 0, 1.2);\n  stage._scene.add(k.target);\n}\ntuneShadows();\nG.interior.visible = false;\nG.people.visible = false;\nconst syncShade = () => { G.shade.visible = !G.interior.visible; };\nsyncShade();\n\nconst inch = (m) => `${Math.round(m / IN * 2) / 2}″`;\nconst ft = (m) => {\n  const t = Math.round(m / IN);\n  const f = Math.floor(t / 12), i = t - f * 12;\n  return `${f}′ ${i}″`;\n};\n\ndocument.getElementById('dims').innerHTML = [\n  ['Window', '31½ × 48″'],\n  ['Sill below grade', inch(-D.sillY)],\n  ['Well depth', inch(-D.floorY)],\n  ['Steps', `${D.steps} × ${inch(D.riser)}`],\n  ['Tread run', inch(D.tread)],\n  ['Well size', `${ft(D.wallFaceX + D.wallT - D.outX)} × ${ft(D.outZ)}`],\n  ['Clear floor', `${ft(D.wallFaceX - D.clearX)} × ${ft(D.clearZ)}`],\n].map(([k, v]) => `<dt>${k}<\u002Fdt><dd>${v}<\u002Fdd>`).join('');\n\nconst cam = stage._camera, ctr = stage._controls;\nconst UP = new THREE.Vector3(0, 1, 0);\n// Orbit directions only — distance and screen offset are derived from the\n// subject's bounds, the live aspect ratio and the panel gutter.\nconst FRAME = {\n  outside: { dir: [-0.90, 0.85, 1.20], pad: 1.05 },\n  exit:    { dir: [-1.35, 0.80, 1.00], pad: 0.92 },\n  top:     { dir: [-0.14, 1.45, 0.60], pad: 0.95 },\n  house:   { dir: [-0.62, 0.22, 1.25], pad: 1.02, subject: 'house', fixed: true },\n};\nlet current = 'outside';\n\nfunction setView(key) {\n  current = key;\n  const sv = mirrored ? -1 : 1;\n  ctr.autoRotate = false;\n  cam.near = 0.05; cam.far = 300;\n\n  if (key === 'inside') {\n    cam.updateProjectionMatrix();\n    cam.position.set(0, -0.14, -2.35);\n    ctr.target.set(0, -0.26, 1.70);\n    ctr.update();\n    return;\n  }\n\n  const r = stage.getBoundingClientRect();\n  const vw = r.width || 924, vh = r.height || 540;\n  const aspect = vw / vh;\n  let { dir, pad, subject, fixed } = FRAME[key];\n  const b = new THREE.Box3().setFromObject(subject === 'house' ? G.house : G.well);\n  if (subject !== 'house') b.expandByPoint(new THREE.Vector3(0, D.headY + 0.20, -0.30));\n  const sph = b.getBoundingSphere(new THREE.Sphere());\n  if (vw < 720) pad *= 1.15;\n\n  const vF = THREE.MathUtils.degToRad(cam.fov);\n  const hF = 2 * Math.atan(Math.tan(vF / 2) * aspect);\n  const dist = (sph.radius * pad) / Math.sin(Math.min(vF, hF) / 2);\n\n  const d = new THREE.Vector3(dir[0] * (fixed ? 1 : sv), dir[1], dir[2]).normalize();\n  const pos = sph.center.clone().addScaledVector(d, dist);\n  const right = new THREE.Vector3().crossVectors(d.clone().negate(), UP).normalize();\n  // pan left by half the panel's share of the frame so the subject clears it\n  const p = document.getElementById('panel');\n  const sideways = p.getBoundingClientRect().bottom < vh * 0.9;\n  const panelW = sideways ? (p.offsetWidth || 0) + 32 : 0;\n  const gutter = (panelW / vw) * dist * Math.tan(hF / 2) * 0.6;\n\n  cam.aspect = aspect;\n  cam.updateProjectionMatrix();\n  cam.position.copy(pos).addScaledVector(right, -gutter);\n  ctr.target.copy(sph.center).addScaledVector(right, -gutter);\n  ctr.update();\n}\n\ndocument.getElementById('views').addEventListener('click', (e) => {\n  const b = e.target.closest('button[data-view]');\n  if (!b) return;\n  for (const o of e.currentTarget.children) o.setAttribute('aria-pressed', String(o === b));\n  if (b.dataset.view === 'inside') {\n    G.interior.visible = true;\n    document.querySelector('[data-group=\"interior\"]').setAttribute('aria-pressed', 'true');\n    syncShade();\n  }\n  setView(b.dataset.view);\n});\nif (window.innerWidth <= 720 || window.innerHeight <= 520) document.getElementById('dimsWrap').open = false;\nsetView('outside');\nrequestAnimationFrame(() => setView(current));\nwindow.addEventListener('resize', () => setView(current));\nwindow.addEventListener('orientationchange', () => setTimeout(() => setView(current), 250));\ndocument.getElementById('dimsWrap').addEventListener('toggle', () => setView(current));\n\nconst panelEl = document.getElementById('panel');\nconst collapseBtn = document.getElementById('collapse');\nfunction setCollapsed(on) {\n  panelEl.classList.toggle('is-collapsed', on);\n  collapseBtn.setAttribute('aria-expanded', String(!on));\n  collapseBtn.setAttribute('aria-label', on ? 'Expand panel' : 'Collapse panel');\n  setView(current);\n}\ncollapseBtn.addEventListener('click', () => setCollapsed(!panelEl.classList.contains('is-collapsed')));\nif (small) setCollapsed(true);\n\nconst toggles = document.getElementById('toggles');\ntoggles.addEventListener('click', (e) => {\n  const b = e.target.closest('button[data-group]');\n  if (!b) return;\n  const on = b.getAttribute('aria-pressed') !== 'true';\n  b.setAttribute('aria-pressed', String(on));\n  G[b.dataset.group].visible = on;\n  syncShade();\n});\n\nlet allWood = false;\nlet cap = 'mahogany';\nconst CAP_NAME = { mahogany: 'mahogany', bluestone: 'bluestone', granite: 'granite', concrete: 'cast concrete', corten: 'weathering steel' };\nfunction setCopy() {\n  const side = mirrored ? ['right', 'left'] : ['left', 'right'];\n  const c = CAP_NAME[cap];\n  document.querySelector('#panel .sub').textContent =\n    `Straight wall on your ${side[0]} as you climb out; terraced steps across the front and ${side[1]}. ` +\n    (allWood ? `Faced in ${c} over a hidden block core.` : `Cinder block with ${c} treads and caps.`);\n}\nsetCopy();\nfunction rebuild() {\n  const hidden = Object.keys(G).filter((k) => !G[k].visible);\n  model = buildModel({ mirror: mirrored, allWood, cap });\n  G = model.userData.groups;\n  for (const k of hidden) if (G[k]) G[k].visible = false;\n  syncShade();\n  stage.setObject(model);\n  tuneShadows();\n  setView(current);\n}\ndocument.getElementById('mirror').addEventListener('click', (e) => {\n  mirrored = !mirrored;\n  e.currentTarget.setAttribute('aria-pressed', String(mirrored));\n  setCopy();\n  rebuild();\n});\ndocument.getElementById('caps').addEventListener('click', (e) => {\n  const b = e.target.closest('button[data-cap]');\n  if (!b) return;\n  for (const o of e.currentTarget.children) o.setAttribute('aria-pressed', String(o === b));\n  cap = b.dataset.cap;\n  setCopy();\n  rebuild();\n});\ndocument.getElementById('allwood').addEventListener('click', (e) => {\n  allWood = !allWood;\n  e.currentTarget.setAttribute('aria-pressed', String(allWood));\n  setCopy();\n  rebuild();\n});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
